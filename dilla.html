<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toko Nata</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
}

header{
    background:#2c3e50;
    color:white;
    padding:20px;
    text-align:center;
}

nav{
    background:#34495e;
    padding:10px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:15px;
}

.banner{
    background:linear-gradient(90deg,#4CAF50,#2ecc71);
    color:white;
    padding:60px;
    text-align:center;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
    overflow:hidden;
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card-body{
    padding:15px;
}

.price{
    color:green;
    font-size:20px;
    font-weight:bold;
    margin:10px 0;
}

button{
    background:#27ae60;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#219150;
}

footer{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}
</style>

</head>
<body>

<header>
<h1>Toko Nata</h1>
<p>Belanja Mudah & Aman</p>
</header>

<nav>
<a href="#">Beranda</a>
<a href="#">Produk</a>
<a href="#">Kontak</a>
</nav>

<section class="banner">
<h2>Promo Hari Ini 🎉</h2>
<p>Diskon hingga 30%</p>
</section>

<div class="container">

<h2 style="margin-bottom:20px;">Produk Terbaru</h2>

<div class="products">

<div class="card">
<img src="https://picsum.photos/300/220?1">
<div class="card-body">
<h3>Sepatu Running</h3>
<p class="price">Rp450.000</p>
<button onclick="beli('Sepatu Running')">Beli Sekarang</button>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/300/220?2">
<div class="card-body">
<h3>Jam Tangan</h3>
<p class="price">Rp250.000</p>
<button onclick="beli('Jam Tangan')">Beli Sekarang</button>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/300/220?3">
<div class="card-body">
<h3>Tas Pria</h3>
<p class="price">Rp320.000</p>
<button onclick="beli('Tas Pria')">Beli Sekarang</button>
</div>
</div>

</div>

</div>

<footer>
© 2026 Toko Nata
</footer>

<script>
function beli(produk){
let nomor="628123456789";
let pesan=`Halo, saya ingin membeli ${produk}`;
window.open(
`https://wa.me/${nomor}?text=${encodeURIComponent(pesan)}`,
"_blank"
);
}
</script>

</body>
</html>
